# Release check (test/README.md): all seven apps in Chromium, on an empty device and with sample data, offline
# and with corrupted saved data, plus the shared files and the ui.js unit tests; then each on an iPhone-sized screen in
# WebKit, Safari's engine (test/webkit.test.js). Any high-severity issue fails the run.
name: Release check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    # Playwright's own image, the same version as the one pinned in ISIONXXX/test/package.json (change both together):
    # Chromium, WebKit and the system packages they need are already in it, so a run installs nothing from Ubuntu's
    # package servers (when those were slow, installing them used up the whole time limit)
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          path: self
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Release check
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: bash self/test/ci.sh ISIONXXX self
