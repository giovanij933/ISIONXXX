<html lang="en">
<head>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<style>
:root{color-scheme:dark;--bg:#070707;--panel:#0c0c0c;--line:#1c1c1c;--line2:#2c2c2c;--green:#33ff66;--red:#ff4545;--tx:#d9d5c8;--dim:#8f8a7e;--amber:#ffb000;--f:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--bar:58px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:12px var(--f);overflow:hidden}
/* the whole app is one full-screen box. --vh is the real screen height: as a home-screen app iOS reports the
   viewport a status bar short, which left a black strip under the tab bar */
body{position:relative;height:100vh;height:var(--vh,100vh)}
/* each app runs in its own frame; frames stay alive so switching tabs keeps your place */
/* apps run full height, under the tab bar: the bar is frosted glass floating over them (iOS 26 style) */
#apps{position:absolute;inset:env(safe-area-inset-top) 0 0 0}
/* switching tabs cross-fades instead of cutting */
#apps>.pane{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);visibility:hidden;opacity:0;transition:opacity .22s ease,visibility 0s linear .22s}
#apps>.pane.on{visibility:visible;opacity:1;transition:opacity .22s ease}
nav button:active{transform:scale(.94)}
@media(prefers-reduced-motion:reduce){#apps>.pane,nav,nav button,#today *{transition:none!important;animation:none!important}}
nav{position:absolute;z-index:5;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));
  bottom:max(10px,calc(env(safe-area-inset-bottom) - 12px));height:64px;padding:6px;border-radius:32px;
  display:flex;gap:0;
  background:rgba(22,22,22,.42);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 10px 30px rgba(0,0,0,.45)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){nav{background:rgba(16,16,16,.94)}}
/* each tab is as wide as its label plus an equal share of the spare room, so the gaps between labels
   are the same whatever the names' lengths (equal-width tabs left short names floating in space) */
nav button{all:unset;flex:1 1 auto;min-width:0;padding:0 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:26px;color:rgba(217,213,200,.62);font:600 9px var(--f);letter-spacing:.05em;position:relative;-webkit-tap-highlight-color:transparent;transition:background .2s,color .2s}
nav button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
nav button:hover{color:var(--tx)}
/* scrolling down (or opening a dialog) slides the bar away; scrolling up brings it back */
nav{transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s}
nav.away{transform:translateY(calc(100% + 40px));opacity:0;pointer-events:none}
nav button.on{color:var(--amber);background:rgba(255,176,0,.16);box-shadow:inset 0 0 0 1px rgba(255,176,0,.22)}
nav button:focus-visible{outline:1px solid var(--amber);outline-offset:-4px}
.ld{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;background:var(--bg)}
.ld i{display:inline-block;width:.6em;height:1.05em;margin-left:6px;background:var(--amber);vertical-align:-2px;animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
/* TODAY */
#today{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:0 16px calc(var(--isx-tabs,96px) + 20px);font-size:13px;line-height:1.45;font-variant-numeric:tabular-nums}
#today .in{max-width:1180px;margin:0 auto}
#today .th{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
#today .brand{font-weight:600;font-size:14px;letter-spacing:.14em}#today .brand b{color:var(--amber)}
#today .cur{display:inline-block;width:.6em;height:1.05em;margin-left:6px;background:var(--amber);vertical-align:-2px;animation:bl 1.1s steps(1) infinite}
#today .dt{color:var(--dim);font-size:11px;letter-spacing:.12em;white-space:nowrap}
#today .h{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}#today .h::before{content:'> ';color:var(--dim)}
#today .sub{color:var(--dim);font-size:12px}#today .sub b{font-weight:600}
#today .pos{color:var(--green)}#today .neg{color:var(--red)}#today .amb{color:var(--amber)}
.tg{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
/* hero: greeting, one ring per app, next up */
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 0% 0%,rgba(255,176,0,.10),transparent 60%),var(--panel);border:1px solid var(--line);padding:18px 16px 16px;margin-bottom:12px;animation:tIn .4s cubic-bezier(.2,.8,.2,1) both}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero h2{margin:0;font-size:20px;font-weight:600;letter-spacing:.02em}
.hero-sub{margin:4px 0 0;color:var(--dim);font-size:12px}
.hero-n{margin:0;font-size:12px;color:var(--dim)}.hero-n b{font-size:30px;color:var(--amber);font-weight:600;margin-right:2px}
.hero.perfect .hero-n b{color:var(--green)}
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(56px,1fr));gap:6px;margin:16px 0 4px;padding:0;list-style:none}
.ring{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0;font-size:9.5px;letter-spacing:.08em;color:var(--dim);-webkit-tap-highlight-color:transparent;transition:transform .15s}
.ring:active{transform:scale(.94)}.ring:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.ring svg{width:52px;height:52px;transform:rotate(-90deg);overflow:visible}
.ring circle{fill:none;stroke-width:4.5}.ring .rt{stroke:#1d1d1d}
.ring .rf{stroke:var(--amber);stroke-linecap:round;transition:stroke-dasharray 1s cubic-bezier(.2,.8,.2,1),stroke .3s}
.ring.done .rf{stroke:var(--green)}.ring.done{color:var(--tx)}.ring.rest .rf{stroke:#5a5a5a}
.ring .ck{fill:none;stroke:var(--green);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transform:rotate(90deg);transform-origin:22px 22px;stroke-dasharray:20;stroke-dashoffset:0;animation:ck .5s .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes ck{from{stroke-dashoffset:20}}
.ring.pop svg{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{40%{transform:rotate(-90deg) scale(1.22)}}
.hero.burst::after{content:'';position:absolute;inset:-40%;background:radial-gradient(circle,rgba(51,255,102,.22),transparent 55%);animation:burst 1.4s ease-out forwards;pointer-events:none}
@keyframes burst{from{opacity:0;transform:scale(.4)}25%{opacity:1}to{opacity:0;transform:scale(1.4)}}
.hero .nx{margin-top:12px}
/* timeline */
.tl-wrap,.done-wrap{background:var(--panel);border:1px solid var(--line);padding:14px 16px;margin:12px 0}
.tl{list-style:none;margin:6px 0 0;padding:0;position:relative}
.tl::before{content:'';position:absolute;left:72px;top:8px;bottom:8px;width:1px;background:var(--line2)}
.tl li{display:grid;grid-template-columns:64px 17px 1fr;align-items:baseline;gap:0;padding:6px 0;font-size:12.5px;animation:tIn .35s cubic-bezier(.2,.8,.2,1) both}
.tl time{color:var(--dim);font-size:11px;text-align:right;padding-right:4px;white-space:nowrap}
.tl i{width:9px;height:9px;border-radius:50%;background:var(--amber);justify-self:center;align-self:center;position:relative;z-index:1;box-shadow:0 0 0 3px var(--panel)}
.tl b{font-size:10px;letter-spacing:.12em;color:var(--dim);font-weight:600;margin-right:6px}
.tl-training i{background:var(--green)}.tl-nutrition i{background:#7f9cb0}.tl-learn i{background:#c8b38a}.tl-journal i{background:#9c8aa5}.tl-rewire i{background:#ff7a33}.tl-checkin i{background:var(--dim)}
#today.drawn .tl li,#today.drawn .hero{animation:none}
/* done today: finished cards fold into compact rows */
.done-wrap .ci{border:0;padding:0;margin:8px 0 10px;background:none}
.done-list{margin-top:6px;gap:8px}
.done-list .ui-card{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:12px;padding:12px 14px;background:#0a0a0a}
.done-list .ui-card-head{margin:0;grid-column:1}.done-list .ui-big{grid-column:2;grid-row:1;font-size:15px;margin:0;color:var(--tx)}
.done-list .ui-status{display:none}
.done-list .ui-sub,.done-list .ui-meter,.done-list .ui-week,.done-list .ui-actions,.done-list .ui-rows{display:none}
.ui-card.flash{animation:flash 1.1s ease-out}@keyframes flash{0%,30%{box-shadow:0 0 0 2px var(--amber)}to{box-shadow:0 0 0 2px transparent}}
@media(prefers-reduced-motion:reduce){.ring .rf,.ring .ck,.ring.pop svg,.hero.burst::after,.ui-card.flash,.tl li,.hero{animation:none!important;transition:none!important}}
/* insights */
.ins{background:var(--panel);border:1px solid var(--line);padding:14px 16px;margin-bottom:12px;animation:tIn .35s cubic-bezier(.2,.8,.2,1) both}
.ins .in1{margin:8px 0 0;font-size:13px;line-height:1.5;padding-left:14px;position:relative}.ins .in1::before{content:'';position:absolute;left:0;top:.6em;width:6px;height:6px;background:var(--amber)}
.ins .in1 b{color:var(--amber);font-weight:600}.ins .in1 b.pos{color:var(--green)}.ins .in1 b.neg{color:var(--red)}
.ins .ft{margin-top:10px;font-size:10.5px}
.ins.sto{border-color:rgba(255,176,0,.45)}.ins.sto.bad{border-color:var(--red)}.ins.sto.bad .h{color:var(--red)}
/* morning check-in */
.ci{background:var(--panel);border:1px solid var(--amber);padding:14px 16px 16px;margin-bottom:12px;animation:tIn .35s cubic-bezier(.2,.8,.2,1) both}
.ci.done{border-color:var(--line);padding-bottom:14px}
.ci button.st{all:unset;cursor:pointer;font-size:10px;letter-spacing:.12em;padding:2px 6px;border:1px solid #1d6b3f;color:var(--green)}
.ci-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ci-l{font-size:12px;color:var(--dim)}.ci-l em{font-style:normal;color:var(--amber);margin-left:6px}
.ci-w{display:flex;align-items:center;gap:6px}.ci-w input{width:86px;background:#0a0a0a;border:1px solid var(--line2);color:var(--tx);font:14px var(--f);padding:7px 8px;text-align:right}.ci-w input:focus{outline:0;border-color:var(--amber)}.ci-w span{font-size:11px;color:var(--dim)}
.ci-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:10px;margin-top:6px}
.ci-sum b{display:block;font-size:16px;font-weight:600}.ci-sum span{font-size:10.5px;color:var(--dim);white-space:nowrap}
#today .acts{display:flex;align-items:center;gap:10px}
#today h1.brand,#today h2.h{margin:0;font-weight:600}#today h2.h{font-weight:400}
#today .tg>.ui-card,#today .tg>.tc-none{animation:tIn .35s cubic-bezier(.2,.8,.2,1) both}#today.drawn .tg>*{animation:none}
/* apps you haven't started: outlined, not faded (fading pushed their text under readable contrast) */
.tc-none .ui-card{border-style:dashed;background:none}.tc-none .ui-card{height:100%}
.ci-row .ui-rating{flex:1}.ci-row .ui-field-label{color:var(--dim)}
.ld .ui-skeleton{width:min(420px,calc(100% - 32px))}
#today .th .brand{white-space:nowrap}#today .th .dt b{font-weight:400}
@media(max-width:420px){#today .th .dt i{display:none}.ci-sum{grid-template-columns:1fr 1fr}}
.nx{all:unset;box-sizing:border-box;cursor:pointer;flex:1;text-align:center;padding:11px 8px;border:1px solid var(--line2);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx);-webkit-tap-highlight-color:transparent;transition:background-color .15s,border-color .15s,transform .12s}
.nx:active{transform:scale(.97)}
.nx:focus-visible{outline:1px solid var(--amber)}
.nx{display:flex;justify-content:space-between;gap:10px;width:100%;margin-top:10px;text-align:left;border-color:var(--amber);color:var(--amber)}.nx b{font-weight:600;white-space:nowrap}.tc.none .sub{margin-top:4px}
@keyframes tIn{from{opacity:0;transform:translateY(8px)}}
#today.drawn .tc,#today.drawn .ci,#today.drawn .ins{animation:none}
.tch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.st{font-size:10px;letter-spacing:.12em;color:var(--dim);border:1px solid var(--line2);padding:2px 6px}.st.ok{color:var(--green);border-color:#1d6b3f}.st.bad{color:var(--red);border-color:#6b1d1d}
/* seven labels on a small phone: NUTRITION is the longest */
@media(max-width:400px){nav button{letter-spacing:.01em}}
@media(min-width:900px){nav.away{transform:translate(-50%,calc(100% + 40px))}nav{left:50%;right:auto;transform:translateX(-50%);width:min(760px,calc(100% - 24px));height:56px}nav button{flex-direction:row;gap:8px;font-size:11px}}
</style>

<body>
<main id="apps"><section id="today" class="pane" aria-label="Today"></section></main>
<nav id="tabs" aria-label="Apps"></nav>
<!-- the morning check-in is the shell's own data; TODAY re-reads it, so a change from another device redraws instead of reloading -->
<script src="sync.js" data-keys="isx.checkin.v1" data-noreload></script>
<script src="ui.js"></script>
<script>
'use strict';
// the apps live next to this one on GitHub Pages (giovanij933.github.io/<repo>/), so they share this site's storage:
// installing this one app gives all six one storage, one sync setup, and REWIRE can see the others' logs
const TABS=[
  {id:'today',label:'TODAY',pane:1,icon:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'},
  {id:'mind',label:'MIND',path:'../MEDITATE/',icon:'<circle cx="12" cy="11" r="7"/><circle cx="12" cy="11" r="3"/>'},
  {id:'training',label:'TRAIN',path:'../TRAINING/',icon:'<path d="M3 12h18M6 8v8M18 8v8M4 10v4M20 10v4"/>'},
  {id:'nutrition',label:'NUTRITION',path:'../nutrition/',icon:'<path d="M3 11h18a9 8 0 0 1-18 0z"/><path d="M9 7v1M12 5v3M15 7v1"/>'},
  {id:'learn',label:'LEARN',path:'../data-analytics/',icon:'<path d="M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3zM21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"/>'},
  {id:'journal',label:'JOURNAL',path:'../JOURNAL/',icon:'<path d="M4 18l5-6 4 3 7-9"/><path d="M15 6h5v5"/>'},
  {id:'rewire',label:'REWIRE',path:'../rewire/',icon:'<path d="M3 8h6l6 8h6M17 12l4 4-4 4M3 16h5"/>'}
];
const $=s=>document.querySelector(s),apps=$('#apps');
// iOS home-screen app: size to the real screen (portrait or landscape), not the short viewport iOS reports
function fit(){
  if(!navigator.standalone)return;
  const l=matchMedia('(orientation: landscape)').matches,a=screen.width,b=screen.height;
  document.documentElement.style.setProperty('--vh',(l?Math.min(a,b):Math.max(a,b))+'px');
}
fit();addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,300));
// inside the shell every app gets the same frame: header pinned to the top (brand, then one row of actions you
// can swipe), nothing floating over the content. Injected here so the apps stay unchanged when opened on their own.
const EMBED_CSS=`
html.isx-embed body{padding-top:14px!important;padding-bottom:calc(var(--isx-tabs,96px) + 20px)!important}
html.isx-embed #toast,html.isx-embed .toast{bottom:calc(var(--isx-tabs,96px) + 12px)!important}
html.isx-embed header.top{position:sticky;top:0;z-index:8;background:#070707;margin-top:-14px;padding:12px 0 10px;row-gap:8px}
html.isx-embed header.top .brand{font-size:14px}
html.isx-embed header.top .acts{flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:none;-webkit-overflow-scrolling:touch}
html.isx-embed header.top .acts::-webkit-scrollbar{display:none}
html.isx-embed header.top .acts>*{flex:none}
html.isx-embed dialog{max-height:calc(100% - 24px)}
/* motion: taps respond, dialogs and sheets ease in, no 300 ms tap delay */
html.isx-embed{-webkit-tap-highlight-color:transparent}
html.isx-embed button,html.isx-embed .btn,html.isx-embed select,html.isx-embed .cd,html.isx-embed .chip{touch-action:manipulation;transition:background-color .15s,border-color .15s,color .15s,transform .12s}
html.isx-embed button:active,html.isx-embed .btn:active,html.isx-embed .chip:active{transform:scale(.97)}
html.isx-embed dialog[open],html.isx-embed .modal:not(.hidden) .box{animation:isxPop .26s cubic-bezier(.2,.8,.2,1)}
html.isx-embed dialog[open]::backdrop,html.isx-embed .modal:not(.hidden){animation:isxFade .2s ease}
html.isx-embed .po:not(.hidden){animation:isxUp .3s cubic-bezier(.2,.8,.2,1)}
@keyframes isxPop{from{opacity:0;transform:translateY(14px) scale(.98)}}
@keyframes isxFade{from{opacity:0}}
@keyframes isxUp{from{opacity:0;transform:translateY(28px)}}
@media(prefers-reduced-motion:reduce){html.isx-embed *{animation:none!important;transition:none!important}}
@media(max-width:560px){html.isx-embed header.top{flex-direction:column;align-items:stretch}html.isx-embed header.top .acts{justify-content:flex-start}}`;
function embed(f){
  try{
    const d=f.contentDocument;if(!d||d.getElementById('isx-embed'))return;
    d.documentElement.classList.add('isx-embed');
    const st=d.createElement('style');st.id='isx-embed';st.textContent=EMBED_CSS;d.head.appendChild(st);
  }catch(e){}
  room(f);
}
// how much of the bottom of each app the floating bar covers
function room(f){
  try{
    const n=$('#tabs').getBoundingClientRect(),a=apps.getBoundingClientRect();
    f.contentDocument.documentElement.style.setProperty('--isx-tabs',Math.round(a.bottom-n.top)+'px');
  }catch(e){}
}
function roomToday(){const n=$('#tabs').getBoundingClientRect(),a=apps.getBoundingClientRect();$('#today').style.setProperty('--isx-tabs',Math.round(a.bottom-n.top)+'px')}
addEventListener('resize',()=>{document.querySelectorAll('#apps iframe').forEach(room);roomToday()});

/* hide the bar while scrolling down, show it on the way up (iOS style). It also stays out of the way while a
   dialog or full-screen view is open in the app, whose bottom buttons it would otherwise cover. */
const bar=$('#tabs');
let barAway=false;
const setBar=away=>{if(away!==barAway){barAway=away;bar.classList.toggle('away',away)}};
function watch(f){
  try{
    const d=f.contentDocument,last=new WeakMap();
    last.set(d.scrollingElement,d.scrollingElement.scrollTop);
    // capture: catches the page and anything scrollable inside it (dialogs, lesson view, tables)
    d.addEventListener('scroll',e=>{
      const el=e.target===d?d.scrollingElement:e.target,y=el.scrollTop;
      if(!last.has(el)){last.set(el,y);return}
      const p=last.get(el);if(Math.abs(y-p)<8)return;last.set(el,y);
      // at the very end it comes back, like Safari's toolbar: each app leaves room for it there
      const end=y+el.clientHeight>=el.scrollHeight-4;
      if(f.classList.contains('on')&&!modalOpen(f))setBar(y>p&&y>40&&!end);
    },{capture:true,passive:true});
  }catch(e){}
}
const modalOpen=f=>{try{return !!f.contentDocument.querySelector('dialog[open], .modal:not(.hidden), .po:not(.hidden)')}catch(e){return false}};
let wasModal=false;
setInterval(()=>{
  if(document.querySelector('body>dialog[open]')){setBar(true);wasModal=true;return}   // the shell's own sync dialog
  const f=document.querySelector('#apps iframe.on');if(!f)return;
  const m=modalOpen(f);
  if(m)setBar(true);else if(wasModal)setBar(false);
  wasModal=m;
},300);
// old names still open the right tab (links and bookmarks from before the rename)
const OLD={fuel:'nutrition',extract:'learn'};
const pick=id=>TABS.find(t=>t.id===(OLD[id]||id))||TABS[0];   // TABS[0] = TODAY
$('#tabs').innerHTML=TABS.map(t=>`<button type="button" data-t="${t.id}" aria-label="${t.label}"><svg viewBox="0 0 24 24" aria-hidden="true">${t.icon}</svg>${t.label}</button>`).join('');
let cur=null;
// an app's frame: made the first time it's needed, then kept so switching back keeps your place
function frame(t,path){
  let f=document.getElementById('f-'+t.id);
  if(f)return f;
  f=document.createElement('iframe');f.id='f-'+t.id;f.className='pane';f.title=t.label;f.src=path||t.path;
  // every load, including the app reloading itself after a sync
  f.addEventListener('load',()=>{f.dataset.ready=1;document.getElementById('ld-'+t.id)?.remove();embed(f);watch(f)});
  apps.append(f);return f;

    a=mean(good,e=>vol[e.day]||null);b=mean(short,e=>vol[e.day]||null);
    if(ok(a,b)&&b.v&&Math.abs(a.v/b.v-1)>=.1)out.push({s:Math.abs(a.v/b.v-1),t:`Lifting volume is <b>${pc(Math.abs(a.v/b.v-1))} ${a.v>b.v?'higher':'lower'}</b> on days after 7+ h of sleep.`});
    a=mean(hi,e=>wd[e.day]?1:0);b=mean(lo,e=>wd[e.day]?1:0);
    if(ok(a,b)&&Math.abs(a.v-b.v)>=.15)out.push({s:Math.abs(a.v-b.v),t:`On high-energy mornings you train <b>${pc(a.v)}</b> of the time vs <b>${pc(b.v)}</b> on low-energy ones.`});
  }
  if(Object.keys(md).length){
    a=mean(good,e=>md[e.day]?1:0);b=mean(short,e=>md[e.day]?1:0);
    if(ok(a,b)&&Math.abs(a.v-b.v)>=.15)out.push({s:Math.abs(a.v-b.v),t:`You meditate on <b>${pc(a.v)}</b> of days after 7+ h of sleep vs <b>${pc(b.v)}</b> after less.`});
  }
  if(Object.keys(pnl).length){
    a=mean(good,e=>pnl[e.day]??null);b=mean(short,e=>pnl[e.day]??null);
    if(ok(a,b)&&Math.abs(a.v-b.v)>=25)out.push({s:.5+Math.min(.5,Math.abs(a.v-b.v)/1000),t:`Trading days after 7+ h of sleep average <b class="${a.v>=0?'pos':'neg'}">${money(a.v)}</b> vs <b class="${b.v>=0?'pos':'neg'}">${money(b.v)}</b> after less.`});
    a=mean(hi,e=>pnl[e.day]??null);b=mean(lo,e=>pnl[e.day]??null);
    if(ok(a,b)&&Math.abs(a.v-b.v)>=25)out.push({s:.4+Math.min(.5,Math.abs(a.v-b.v)/1000),t:`High-energy trading days average <b class="${a.v>=0?'pos':'neg'}">${money(a.v)}</b> vs <b class="${b.v>=0?'pos':'neg'}">${money(b.v)}</b> on low-energy ones.`});
  }
  if(isFinite(rwStart)){
    const since=e=>pd(e.day).getTime()+864e5>rwStart;
    a=mean(good.filter(since),e=>slip[e.day]?1:0);b=mean(short.filter(since),e=>slip[e.day]?1:0);
    if(ok(a,b)&&Math.abs(a.v-b.v)>=.1)out.push({s:Math.abs(a.v-b.v)+.1,t:`You slip on <b>${pc(b.v)}</b> of days after short sleep vs <b>${pc(a.v)}</b> after 7+ h.`});
  }
  return {n:C.length,days:past.length,list:out.sort((x,y)=>y.s-x.s).slice(0,3)};
}
// all apps share one storage quota (sync.js keeps count); speak up well before a save can fail
function stoHTML(){
  const s=window.ISXSync?.storage?.();if(!s||s.ratio<.8)return'';
  const kb=n=>(n*=2)<1048576?Math.round(n/1024)+' KB':(n/1048576).toFixed(1)+' MB',top=s.apps.filter(a=>!['Sync','Other'].includes(a.app)).slice(0,3),full=s.ratio>=.97;
  return `<section class="ins sto${full?' bad':''}" role="${full?'alert':'status'}"><div class="tch"><h2 class="h">Storage ${Math.min(100,Math.round(s.ratio*100))}% full</h2><span class="st">${kb(s.used)} of ${kb(s.budget)}</span></div>
    <p class="in1">All apps share this space on this device. ${full?'New entries may not save until you make room.':'When it fills up, new entries can’t be saved.'}
    Biggest: ${top.map(a=>`<b>${esc(a.app)}</b> ${kb(a.chars)}`).join(' · ')}.</p>
    <p class="in1">Take a backup in that app, then delete old or sample data.</p></section>`;
}
function insHTML(){
  const I=insights();
  if(!I.n)return '';
  if(!I.list)return `<section class="ins"><div class="tch"><h2 class="h">Insights</h2><span class="st">${I.n} / ${INS_MIN}</span></div>
    <div class="sub">Check in ${INS_MIN-I.n} more morning${INS_MIN-I.n===1?'':'s'} and this shows how your sleep and energy line up with your training, meditation, trading and habits.</div>
    ${UI.meter({label:'Check-ins',value:I.n,max:INS_MIN})}</section>`;
  return `<section class="ins"><div class="tch"><h2 class="h">Insights</h2><span class="st">${I.days} DAYS</span></div>
    ${I.list.length?I.list.map(x=>`<p class="in1">${x.t}</p>`).join(''):'<p class="sub">No clear patterns yet. Keep checking in; they show up once there are enough days on both sides.</p>'}
    <div class="sub ft">Patterns in your own data, not proof. Short sleep = under 7 h.</div></section>`;

/* ---------- TODAY, fluid: rings, a timeline of the day, done cards folding away, motion with meaning ---------- */
const TF=new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit'});
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
// how far each app is today, 0–1, for its ring: done = full; otherwise its goal bar
const ringOf=c=>c.done||c.rest?1:c.meter&&c.meter.max>0?Math.max(0,Math.min(1,c.meter.v/c.meter.max)):0;
const PREV={ring:{},big:{},done:{}};let firstDraw=true;
function heroHTML(wins,next){
  const won=wins.filter(c=>c.done).length,all=wins.length&&won===wins.length,h=new Date().getHours();
  const hello=h<5?'Still up':h<12?'Good morning':h<18?'Good afternoon':'Good evening';
  return `<section class="hero${all?' perfect':''}" aria-labelledby="hero-h">
    <div class="hero-top"><div><h2 id="hero-h">${hello}</h2><p class="hero-sub">${!wins.length?'Log something in any app to start your day.':all?'Everything done today. Perfect day.':won?`${won} of ${wins.length} done · ${wins.length-won} to go`:`${wins.length} to do today`}</p></div>
      ${wins.length?`<p class="hero-n" aria-hidden="true"><b>${won}</b>/${wins.length}</p>`:''}</div>
    ${wins.length?`<ul class="rings" aria-label="Today's progress">${wins.map(c=>{const f=ringOf(c),from=PREV.ring[c.id]??0;
      return `<li><button type="button" class="ring${c.done?' done':''}${c.rest?' rest':''}" data-jump="${c.id}" aria-label="${c.label}: ${c.done?'done':c.rest?'rest day':Math.round(f*100)+'%'}">
        <svg viewBox="0 0 44 44" aria-hidden="true"><circle class="rt" cx="22" cy="22" r="18"/><circle class="rf" cx="22" cy="22" r="18" pathLength="100" stroke-dasharray="${(from*100).toFixed(1)} 100" data-to="${(f*100).toFixed(1)}"/>${c.done?'<path class="ck" d="M15.5 22.5l4.5 4.5 8.5-9"/>':''}</svg><span>${c.label}</span></button></li>`}).join('')}</ul>`:''}
    ${next?`<button type="button" class="nx" data-go="${next.id}" data-act="${QA[next.id][0][0]}"><span>Next up · ${next.label}</span><b>${QA[next.id][0][1]}</b></button>`:''}
  </section>`;
}
/* everything logged today across the apps, oldest first */
const KN={M:'Meditation',B:'Breathwork',S:'Body scan',V:'Visualization',F:'Focus',J:'Journaling'};
function timeline(t){
  const out=[],add=(at,app,text)=>{if(isFinite(at))out.push({at,app,text})};
  arr(read('isx.mind.v1')?.log).filter(e=>dayAt(e.at)===t).forEach(e=>add(e.at,'mind',`${KN[e.kind]||'Session'} · ${Math.round(+e.mins||0)} min`));
  // a workout is entries less than 90 min apart
  let w=null;arr(read('isx.training.v1')?.log).filter(e=>dayAt(e.at)===t).sort((a,b)=>a.at-b.at).forEach(e=>{
    if(!w||e.at-w.last>90*6e4){w={at:e.at,last:e.at,n:0,s:0,str:0};out.push(w)}w.last=e.at;e.type==='S'?w.str++:w.n++;w.s+=(+e.sets||0)*(+e.reps||0)*(+e.load||0)});
  out.forEach(x=>{if(x.n!=null&&!x.app){x.app='training';x.text=x.n?`Workout · ${plural(x.n,'exercise')}${x.s?` · ${fi(x.s)} ${wUnit()}`:''}`:`Stretch · ${plural(x.str,'hold')}`}});
  arr(read('nj.meals.v1')).filter(m=>dayAt(Date.parse(m.time))===t).forEach(m=>add(Date.parse(m.time),'nutrition',m.kind==='bowl'?`Balanced bowl${m.protein?' · '+m.protein:''}`:`${m.name||'Food'}${+m.kcal?` · ${fi(+m.kcal)} kcal`:''}`));
  arr(read('xl.sessions.v1')).filter(x=>dayAt(Date.parse(x.time))===t).forEach(x=>add(Date.parse(x.time),'learn',`Study · ${Math.round(+x.min||0)} min`));
  const js=read('isx.journal.v1'),roll=js?.roll??18,tday=ms=>{const d=new Date(ms);if(roll&&d.getHours()>=roll)d.setDate(d.getDate()+1);return ymd(d)};
  const tr=arr(js?.trades).filter(x=>tday(x.close)===t);
  if(tr.length){const pnl=tr.reduce((a,x)=>a+(x.exit-x.entry)*(x.side==='Short'?-1:1)*x.qty*x.mult-(+x.fee||0)-(+x.comm||0),0);add(Math.max(...tr.map(x=>x.close)),'journal',`${plural(tr.length,'trade')} · ${money(pnl)}`)}
  const rw=read('isx.rewire.v1'),bn=id=>arr(rw?.bad).find(b=>b.id===id)?.name||'';
  arr(rw?.log).filter(e=>dayAt(e.at)===t).forEach(e=>add(e.at,'rewire',e.t==='slip'?`Slipped · ${bn(e.b)}`:e.t==='resist'?`Beat an urge · ${bn(e.b)}`:`${e.g||'Good habit'} ✓`));
  const ci=ciLog().find(e=>e.day===t);if(ci)add(ci.at,'checkin',`Checked in · ${ci.sleep} h sleep`);
  return out.filter(x=>x.app).sort((a,b)=>a.at-b.at);
}
const TL={mind:'MIND',training:'TRAIN',nutrition:'NUTRITION',learn:'LEARN',journal:'JOURNAL',rewire:'REWIRE',checkin:'CHECK-IN'};
function timelineHTML(t){
  const T=timeline(t);
  return `<section class="tl-wrap" aria-labelledby="tl-h"><div class="tch"><h2 class="h" id="tl-h">Today so far</h2><span class="st">${T.length?plural(T.length,'entry').replace('entrys','entries'):'—'}</span></div>
    ${T.length?`<ol class="tl">${T.map(x=>`<li class="tl-${x.app}"><time>${TF.format(x.at)}</time><i aria-hidden="true"></i><span><b>${TL[x.app]}</b> ${esc(x.text)}</span></li>`).join('')}</ol>`
      :'<p class="sub">Your day shows up here as you log: sessions, workouts, meals, study, trades and habits, in order.</p>'}</section>`;
}
/* after a redraw: rings fill from where they were, numbers count up, finished things celebrate, cards glide to their
   new place (FLIP). All skipped under Reduce Motion. */
function animateToday(el,rects){
  const calm=reduced();
  el.querySelectorAll('.rf[data-to]').forEach(r=>{const to=r.dataset.to;calm?r.setAttribute('stroke-dasharray',`${to} 100`):requestAnimationFrame(()=>requestAnimationFrame(()=>r.setAttribute('stroke-dasharray',`${to} 100`)))});
  el.querySelectorAll('[data-card]').forEach(c=>{
    const id=c.dataset.card,big=c.querySelector('.ui-big');
    if(big){const now=big.textContent,was=PREV.big[id];PREV.big[id]=now;if(!calm&&was!==now)countUp(big,was??null,now)}
    const r=rects[id];if(!r||calm)return;const n=c.getBoundingClientRect(),dy=r.top-n.top;
    if(Math.abs(dy)>2){c.style.transform=`translateY(${dy}px)`;c.style.transition='none';requestAnimationFrame(()=>{c.style.transition='transform .5s cubic-bezier(.2,.8,.2,1)';c.style.transform=''})}
  });
}
// counts the first number in a value up from its old value (or 0): "1,420 kcal", "12 min", "+$340"
function countUp(node,from,to){
  const re=/-?\d[\d,]*(\.\d+)?/,m=to.match(re);if(!m)return;
  const end=+m[0].replace(/,/g,''),fm=from&&from.match(re),start=fm?+fm[0].replace(/,/g,''):0,dp=(m[1]||'').length-(m[1]?1:0);
  if(start===end)return;
  const fmt=v=>{const s=Math.abs(v).toFixed(dp),[i,f]=s.split('.');return (v<0?'-':'')+(m[0].includes(',')||Math.abs(end)>=1000?Number(i).toLocaleString('en-US'):i)+(f?'.'+f:'')};
  const t0=performance.now(),D=650;
  const step=now=>{const k=Math.min(1,(now-t0)/D),e=1-Math.pow(1-k,3);node.textContent=to.replace(re,fmt(start+(end-start)*e));if(k<1&&node.isConnected)requestAnimationFrame(step);else node.textContent=to};
  requestAnimationFrame(step);
}
// something just got done: its ring and card pop, and the whole day gets a moment when it's complete
function celebrate(el,wins){
  if(firstDraw){wins.forEach(c=>PREV.done[c.id]=!!c.done);return}
  const fresh=wins.filter(c=>c.done&&PREV.done[c.id]===false);wins.forEach(c=>PREV.done[c.id]=!!c.done);
  if(!fresh.length)return;
  fresh.forEach(c=>{el.querySelector(`.ring[data-jump="${c.id}"]`)?.classList.add('pop')});
  const all=wins.length&&wins.every(c=>c.done);
  UI.toast(all?'Perfect day: everything done ✓':`${fresh.map(c=>c.label).join(' + ')} done ✓`);
  if(all)el.querySelector('.hero')?.classList.add('burst');
}
let lastToday='';
function drawToday(){
  const el=$('#today');if(!el)return;
  if(document.activeElement?.id==='ciw')return;   // don't redraw under you while you type your weight
  const t=ymd(new Date()),C=[tMind(t),tTrain(t),tFuel(t),tExtract(t),tJournal(),tRewire(t)];
  const ids=['mind','training','nutrition','learn','journal','rewire'],used=C.filter(Boolean),wins=used.filter(c=>c.done!=null),won=wins.filter(c=>c.done).length;
  const next=wins.find(c=>!c.done&&!c.rest);
  const d=new Date(),date=d.toLocaleDateString('en-US',{weekday:'short',day:'numeric',month:'short'}).toUpperCase();
  const card0=(c,i)=>c?card(c):`<div class="tc-none">${UI.card({id:ids[i],title:TABS.find(x=>x.id===ids[i]).label,status:{text:'Start'},sub:[EMPTY[ids[i]]],openLabel:`Start using ${TABS.find(x=>x.id===ids[i]).label}`})}</div>`;
  // still to do (and neutral: journal, rest day) on top; done folds into a compact list below the timeline; apps you
  // haven't started at the very end
  const rank=c=>!c?3:c.done===false||c.slip?0:c.done?2:1,idx=C.map((c,i)=>[rank(c),i]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const group=r=>idx.filter(x=>x[0]===r||(r===0&&x[0]===1)).map(x=>card0(C[x[1]],x[1])).join('');
  const ciDone=ciLog().some(e=>e.day===t)&&!CI,ci=ciHTML(),todo=group(0),done=group(2),unused=group(3);
  const html=`<div class="in"><header class="th top"><h1 class="brand">ISIONXXX <b>//</b> TODAY<span class="cur" aria-hidden="true"></span></h1><div class="acts"><span class="dt"><i>${date.split(',')[0]}, </i>${date.split(', ').slice(1).join(', ')}</span></div></header>
    ${stoHTML()}${ciDone?'':ci}${heroHTML(wins,next)}
    ${todo?`<div class="tg">${todo}</div>`:''}
    ${timelineHTML(t)}
    ${done||ciDone?`<section class="done-wrap" aria-labelledby="dn-h"><div class="tch"><h2 class="h" id="dn-h">Done today</h2><span class="st ok">${(done.match(/data-card=/g)||[]).length+(ciDone?1:0)} ✓</span></div>${ciDone?ci:''}<div class="tg done-list">${done}</div></section>`:''}
    ${insHTML()}
    ${unused?`<div class="tg">${unused}</div>`:''}</div>`;
  // only touch the page when something changed; then animate from the old layout to the new one
  if(html!==lastToday){
    const rects={};el.querySelectorAll('[data-card]').forEach(c=>rects[c.dataset.card]=c.getBoundingClientRect());
    lastToday=html;el.innerHTML=html;
    animateToday(el,rects);celebrate(el,wins);UI.animate(el);firstDraw=false;
  }

}

// TODAY refreshes whenever it comes into view, when any app saves, and each minute (clean-time counters)
const todayOn=()=>$('#today').classList.contains('on');

$('#today').addEventListener('ui-change',e=>{const k={'ci-sleep':'sleep','ci-q':'q','ci-energy':'energy'}[e.detail.name];if(k&&CI){CI[k]=e.detail.value;UI.keepFocus(drawToday)}});
{ // the bar hides on scroll here too

// tapping the tab you're already on scrolls it back to the top, like iOS
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;

addEventListener('message',e=>{

addEventListener('hashchange',()=>show(location.hash.slice(1)));

roomToday();show(location.hash.slice(1)||'today');
// with sync on, the other apps load quietly in the background so TODAY shows what you logged on your other devices
try{if(localStorage.getItem('isx.sync.cfg'))TABS.filter(t=>!t.pane).forEach((t,i)=>setTimeout(()=>preload(t.id),1200+i*700))}catch(e){}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
