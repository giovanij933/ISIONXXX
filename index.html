<style>
:root{color-scheme:dark;--bg:#070707;--panel:#0c0c0c;--line:#1c1c1c;--line2:#2c2c2c;--green:#33ff66;--red:#ff4545;--tx:#d9d5c8;--dim:#78746a;--amber:#ffb000;--f:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--bar:58px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:12px var(--f);overflow:hidden}
/* the whole app is one full-screen box. --vh is the real screen height: as a home-screen app iOS reports the
   viewport a status bar short, which left a black strip under the tab bar */
body{position:relative;height:100vh;height:var(--vh,100vh)}
/* each app runs in its own frame; frames stay alive so switching tabs keeps your place */
/* apps run full height, under the tab bar: the bar is frosted glass floating over them (iOS 26 style) */
#apps{position:absolute;inset:env(safe-area-inset-top) 0 0 0}
/* switching tabs cross-fades instead of cutting */
#apps>.pane{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);visibility:hidden;opacity:0;transition:opacity .22s ease,visibility 0s linear .22s}
#apps>.pane.on{visibility:visible;opacity:1;transition:opacity .22s ease}
nav button:active{transform:scale(.94)}
@media(prefers-reduced-motion:reduce){#apps>.pane,nav,nav button,#today *{transition:none!important;animation:none!important}}
nav{position:absolute;z-index:5;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));
  bottom:max(10px,calc(env(safe-area-inset-bottom) - 12px));height:64px;padding:6px;border-radius:32px;
  display:flex;gap:0;
  background:rgba(22,22,22,.42);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 10px 30px rgba(0,0,0,.45)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){nav{background:rgba(16,16,16,.94)}}
/* each tab is as wide as its label plus an equal share of the spare room, so the gaps between labels
   are the same whatever the names' lengths (equal-width tabs left short names floating in space) */
nav button{all:unset;flex:1 1 auto;min-width:0;padding:0 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:26px;color:rgba(217,213,200,.62);font:600 9px var(--f);letter-spacing:.05em;position:relative;-webkit-tap-highlight-color:transparent;transition:background .2s,color .2s}
nav button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
nav button:hover{color:var(--tx)}
/* scrolling down (or opening a dialog) slides the bar away; scrolling up brings it back */
nav{transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s}
nav.away{transform:translateY(calc(100% + 40px));opacity:0;pointer-events:none}
nav button.on{color:var(--amber);background:rgba(255,176,0,.16);box-shadow:inset 0 0 0 1px rgba(255,176,0,.22)}
nav button:focus-visible{outline:1px solid var(--amber);outline-offset:-4px}
.ld{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);letter-spacing:.14em;pointer-events:none}
.ld i{display:inline-block;width:.6em;height:1.05em;margin-left:6px;background:var(--amber);vertical-align:-2px;animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
/* TODAY */
#today{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:0 16px calc(var(--isx-tabs,96px) + 20px);font-size:13px;line-height:1.45;font-variant-numeric:tabular-nums}
#today .in{max-width:1180px;margin:0 auto}
#today .th{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
#today .brand{font-weight:600;font-size:14px;letter-spacing:.14em}#today .brand b{color:var(--amber)}
#today .cur{display:inline-block;width:.6em;height:1.05em;margin-left:6px;background:var(--amber);vertical-align:-2px;animation:bl 1.1s steps(1) infinite}
#today .dt{color:var(--dim);font-size:11px;letter-spacing:.12em;white-space:nowrap}
#today .h{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}#today .h::before{content:'> ';color:var(--dim)}
#today .sub{color:var(--dim);font-size:12px}#today .sub b{font-weight:600}
#today .pos{color:var(--green)}#today .neg{color:var(--red)}#today .amb{color:var(--amber)}
.wins{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);padding:14px 16px;margin-bottom:12px}
.wins svg{width:64px;height:64px;flex:none}.wins circle{fill:none;stroke-width:6}.wins .r0{stroke:#1a1a1a}
.wins .r1{stroke:var(--amber);transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dasharray .5s cubic-bezier(.2,.8,.2,1)}.wins .r1.full{stroke:var(--green)}
.wins text{fill:var(--tx);font:600 14px var(--f);text-anchor:middle}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{all:unset;cursor:pointer;font-size:10px;letter-spacing:.1em;padding:3px 7px;border:1px solid var(--line2);color:var(--dim);-webkit-tap-highlight-color:transparent}
.chips button.ok{color:var(--green);border-color:#1d6b3f}
.tg{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.tc{all:unset;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-start;text-align:left;cursor:pointer;background:var(--panel);border:1px solid var(--line);padding:16px;min-width:0;-webkit-tap-highlight-color:transparent;transition:border-color .15s,transform .12s;animation:tIn .35s cubic-bezier(.2,.8,.2,1) both}
.tc:hover{border-color:var(--line2)}.tc:active{transform:scale(.98)}.tc:focus-visible,.chips button:focus-visible{outline:1px solid var(--amber)}
.tc.none{opacity:.7}
.qa{display:flex;gap:8px;margin-top:14px}
/* morning check-in */
.ci{background:var(--panel);border:1px solid var(--amber);padding:14px 16px 16px;margin-bottom:12px;animation:tIn .35s cubic-bezier(.2,.8,.2,1) both}
.ci.done{border-color:var(--line);padding-bottom:14px}
.ci button.st{all:unset;cursor:pointer;font-size:10px;letter-spacing:.12em;padding:2px 6px;border:1px solid #1d6b3f;color:var(--green)}
.ci-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ci-l{font-size:12px;color:var(--dim)}.ci-l em{font-style:normal;color:var(--amber);margin-left:6px}
.ci-step{display:flex;align-items:center;gap:4px}.ci-step b{min-width:64px;text-align:center;font-size:16px}
.ci-step button,.ci-seg button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;place-items:center;width:36px;height:34px;border:1px solid var(--line2);font-size:13px;-webkit-tap-highlight-color:transparent;transition:background-color .15s,color .15s,transform .12s}
.ci-step button:active,.ci-seg button:active{transform:scale(.94)}
.ci-seg{display:flex}.ci-seg button+button{border-left:0}.ci-seg button.on{background:var(--amber);border-color:var(--amber);color:#000;font-weight:600}
.ci-w{display:flex;align-items:center;gap:6px}.ci-w input{width:86px;background:#0a0a0a;border:1px solid var(--line2);color:var(--tx);font:14px var(--f);padding:7px 8px;text-align:right}.ci-w input:focus{outline:0;border-color:var(--amber)}.ci-w span{font-size:11px;color:var(--dim)}
.ci-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:10px;margin-top:6px}
.ci-sum b{display:block;font-size:16px;font-weight:600}.ci-sum span{font-size:10.5px;color:var(--dim);white-space:nowrap}
#today .acts{display:flex;align-items:center;gap:10px}
#today .th .brand{white-space:nowrap}#today .th .dt b{font-weight:400}
@media(max-width:420px){#today .th .dt i{display:none}.ci-sum{grid-template-columns:1fr 1fr}}
.qa button,.nx{all:unset;box-sizing:border-box;cursor:pointer;flex:1;text-align:center;padding:11px 8px;border:1px solid var(--line2);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx);-webkit-tap-highlight-color:transparent;transition:background-color .15s,border-color .15s,transform .12s}
.qa button:active,.nx:active{transform:scale(.97)}
.qa button.pri{background:var(--amber);border-color:var(--amber);color:#000;font-weight:600}
.qa button:focus-visible,.nx:focus-visible{outline:1px solid var(--amber)}
.nx{display:flex;justify-content:space-between;gap:10px;width:100%;margin-top:10px;text-align:left;border-color:var(--amber);color:var(--amber)}.nx b{font-weight:600;white-space:nowrap}.tc.none .sub{margin-top:4px}
@keyframes tIn{from{opacity:0;transform:translateY(8px)}}
.tch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.st{font-size:10px;letter-spacing:.12em;color:var(--dim);border:1px solid var(--line2);padding:2px 6px}.st.ok{color:var(--green);border-color:#1d6b3f}.st.bad{color:var(--red);border-color:#6b1d1d}
.tc .big{font-size:24px;font-weight:600;margin:2px 0 2px}
.rws{margin-top:8px;font-size:12px}.rws div{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-top:1px solid var(--line)}.rws span{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt{margin-top:10px}.mt .lb{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--dim);margin-bottom:4px}.mt .lb span:last-child{color:var(--tx)}
.mt .bar{height:6px;background:#161616}.mt .bar i{display:block;height:100%;background:var(--amber);transition:width .5s cubic-bezier(.2,.8,.2,1)}.mt .bar i.full{background:var(--green)}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:auto;padding-top:12px}
.dots span{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;color:var(--dim)}.dots span.t{color:var(--amber)}
.dots i{display:block;width:100%;height:6px;background:#161616}.dots i.on{background:var(--amber)}.dots i.half{background:rgba(255,176,0,.35)}.dots i.pos{background:var(--green)}.dots i.neg{background:var(--red)}
/* seven labels on a small phone: NUTRITION is the longest */
@media(max-width:400px){nav button{letter-spacing:.01em}}
@media(min-width:900px){nav.away{transform:translate(-50%,calc(100% + 40px))}nav{left:50%;right:auto;transform:translateX(-50%);width:min(760px,calc(100% - 24px));height:56px}nav button{flex-direction:row;gap:8px;font-size:11px}}
</style>
</head>
<body>
<main id="apps"><section id="today" class="pane" aria-label="Today"></section></main>
<nav id="tabs" aria-label="Apps"></nav>
<!-- the morning check-in is the shell's own data; TODAY re-reads it, so a change from another device redraws instead of reloading -->
<script src="sync.js" data-keys="isx.checkin.v1" data-noreload></script>
<script>
'use strict';
// the apps live next to this one on GitHub Pages (giovanij933.github.io/<repo>/), so they share this site's storage:
// installing this one app gives all six one storage, one sync setup, and REWIRE can see the others' logs
const TABS=[
  {id:'today',label:'TODAY',pane:1,icon:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'},
  {id:'mind',label:'MIND',path:'../MEDITATE/',icon:'<circle cx="12" cy="11" r="7"/><circle cx="12" cy="11" r="3"/>'},
  {id:'training',label:'TRAIN',path:'../TRAINING/',icon:'<path d="M3 12h18M6 8v8M18 8v8M4 10v4M20 10v4"/>'},
  {id:'nutrition',label:'NUTRITION',path:'../nutrition/',icon:'<path d="M3 11h18a9 8 0 0 1-18 0z"/><path d="M9 7v1M12 5v3M15 7v1"/>'},
  {id:'learn',label:'LEARN',path:'../data-analytics/',icon:'<path d="M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3zM21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"/>'},
  {id:'journal',label:'JOURNAL',path:'../JOURNAL/',icon:'<path d="M4 18l5-6 4 3 7-9"/><path d="M15 6h5v5"/>'},
  {id:'rewire',label:'REWIRE',path:'../rewire/',icon:'<path d="M3 8h6l6 8h6M17 12l4 4-4 4M3 16h5"/>'}
];
const $=s=>document.querySelector(s),apps=$('#apps');
// iOS home-screen app: size to the real screen (portrait or landscape), not the short viewport iOS reports
function fit(){
  if(!navigator.standalone)return;
  const l=matchMedia('(orientation: landscape)').matches,a=screen.width,b=screen.height;
  document.documentElement.style.setProperty('--vh',(l?Math.min(a,b):Math.max(a,b))+'px');
}
fit();addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,300));
// inside the shell every app gets the same frame: header pinned to the top (brand, then one row of actions you
// can swipe), nothing floating over the content. Injected here so the apps stay unchanged when opened on their own.
const EMBED_CSS=`
html.isx-embed body{padding-top:14px!important;padding-bottom:calc(var(--isx-tabs,96px) + 20px)!important}
html.isx-embed #toast,html.isx-embed .toast{bottom:calc(var(--isx-tabs,96px) + 12px)!important}
html.isx-embed header.top{position:sticky;top:0;z-index:8;background:#070707;margin-top:-14px;padding:12px 0 10px;row-gap:8px}
html.isx-embed header.top .brand{font-size:14px}
html.isx-embed header.top .acts{flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:none;-webkit-overflow-scrolling:touch}
html.isx-embed header.top .acts::-webkit-scrollbar{display:none}
html.isx-embed header.top .acts>*{flex:none}
html.isx-embed dialog{max-height:calc(100% - 24px)}
/* motion: taps respond, dialogs and sheets ease in, no 300 ms tap delay */
html.isx-embed{-webkit-tap-highlight-color:transparent}
html.isx-embed button,html.isx-embed .btn,html.isx-embed select,html.isx-embed .cd,html.isx-embed .chip{touch-action:manipulation;transition:background-color .15s,border-color .15s,color .15s,transform .12s}
html.isx-embed button:active,html.isx-embed .btn:active,html.isx-embed .chip:active{transform:scale(.97)}
html.isx-embed dialog[open],html.isx-embed .modal:not(.hidden) .box{animation:isxPop .26s cubic-bezier(.2,.8,.2,1)}
html.isx-embed dialog[open]::backdrop,html.isx-embed .modal:not(.hidden){animation:isxFade .2s ease}
html.isx-embed .po:not(.hidden){animation:isxUp .3s cubic-bezier(.2,.8,.2,1)}
@keyframes isxPop{from{opacity:0;transform:translateY(14px) scale(.98)}}
@keyframes isxFade{from{opacity:0}}
@keyframes isxUp{from{opacity:0;transform:translateY(28px)}}
@media(prefers-reduced-motion:reduce){html.isx-embed *{animation:none!important;transition:none!important}}
@media(max-width:560px){html.isx-embed header.top{flex-direction:column;align-items:stretch}html.isx-embed header.top .acts{justify-content:flex-start}}`;
function embed(f){
  try{
    const d=f.contentDocument;if(!d||d.getElementById('isx-embed'))return;
    d.documentElement.classList.add('isx-embed');
    const st=d.createElement('style');st.id='isx-embed';st.textContent=EMBED_CSS;d.head.appendChild(st);
  }catch(e){}
  room(f);
}
// how much of the bottom of each app the floating bar covers
function room(f){
  try{
    const n=$('#tabs').getBoundingClientRect(),a=apps.getBoundingClientRect();
    f.contentDocument.documentElement.style.setProperty('--isx-tabs',Math.round(a.bottom-n.top)+'px');
  }catch(e){}
}
function roomToday(){const n=$('#tabs').getBoundingClientRect(),a=apps.getBoundingClientRect();$('#today').style.setProperty('--isx-tabs',Math.round(a.bottom-n.top)+'px')}
addEventListener('resize',()=>{document.querySelectorAll('#apps iframe').forEach(room);roomToday()});

/* hide the bar while scrolling down, show it on the way up (iOS style). It also stays out of the way while a
   dialog or full-screen view is open in the app, whose bottom buttons it would otherwise cover. */
const bar=$('#tabs');
let barAway=false;
const setBar=away=>{if(away!==barAway){barAway=away;bar.classList.toggle('away',away)}};
function watch(f){
  try{
    const d=f.contentDocument,last=new WeakMap();
    last.set(d.scrollingElement,d.scrollingElement.scrollTop);
    // capture: catches the page and anything scrollable inside it (dialogs, lesson view, tables)
    d.addEventListener('scroll',e=>{
      const el=e.target===d?d.scrollingElement:e.target,y=el.scrollTop;
      if(!last.has(el)){last.set(el,y);return}
      const p=last.get(el);if(Math.abs(y-p)<8)return;last.set(el,y);
      // at the very end it comes back, like Safari's toolbar: each app leaves room for it there
      const end=y+el.clientHeight>=el.scrollHeight-4;
      if(f.classList.contains('on')&&!modalOpen(f))setBar(y>p&&y>40&&!end);
    },{capture:true,passive:true});
  }catch(e){}
}
const modalOpen=f=>{try{return !!f.contentDocument.querySelector('dialog[open], .modal:not(.hidden), .po:not(.hidden)')}catch(e){return false}};
let wasModal=false;
setInterval(()=>{
  if(document.querySelector('body>dialog[open]')){setBar(true);wasModal=true;return}   // the shell's own sync dialog
  const f=document.querySelector('#apps iframe.on');if(!f)return;
  const m=modalOpen(f);
  if(m)setBar(true);else if(wasModal)setBar(false);
  wasModal=m;
},300);
// old names still open the right tab (links and bookmarks from before the rename)
const OLD={fuel:'nutrition',extract:'learn'};
const pick=id=>TABS.find(t=>t.id===(OLD[id]||id))||TABS[0];   // TABS[0] = TODAY
$('#tabs').innerHTML=TABS.map(t=>`<button type="button" data-t="${t.id}" aria-label="${t.label}"><svg viewBox="0 0 24 24" aria-hidden="true">${t.icon}</svg>${t.label}</button>`).join('');
let cur=null;
// an app's frame: made the first time it's needed, then kept so switching back keeps your place
function frame(t,path){
  let f=document.getElementById('f-'+t.id);
  if(f)return f;
  f=document.createElement('iframe');f.id='f-'+t.id;f.className='pane';f.title=t.label;f.src=path||t.path;
  // every load, including the app reloading itself after a sync
  f.addEventListener('load',()=>{f.dataset.ready=1;document.getElementById('ld-'+t.id)?.remove();embed(f);watch(f)});
  apps.append(f);return f;
}
// load an app in the background (TODAY uses this so NUTRITION's totals and every app's sync stay current)
const preload=id=>{const t=TABS.find(x=>x.id===id);if(t&&!t.pane&&!document.getElementById('f-'+id))frame(t)};
function show(id,path){
  const t=pick(id);
  let f;
  if(t.pane){f=$('#today');drawToday()}
  else{
    const had=document.getElementById('f-'+t.id);f=frame(t,path);
    if(had&&path)f.src=path;
    if(!f.dataset.ready&&!document.getElementById('ld-'+t.id)){const ld=document.createElement('div');ld.className='ld';ld.id='ld-'+t.id;ld.innerHTML=`LOADING ${t.label}<i></i>`;apps.append(ld)}
  }
  document.querySelectorAll('#apps>.pane').forEach(x=>x.classList.toggle('on',x===f));
  document.querySelectorAll('#apps>.ld').forEach(x=>x.hidden=x.id!=='ld-'+t.id);
  if(!modalOpen(f))setBar(false);   // switching tabs always brings the bar back
  document.querySelectorAll('#tabs button').forEach(b=>{const on=b.dataset.t===t.id;b.classList.toggle('on',on);b.setAttribute('aria-current',on?'page':'false')});
  if(cur!==t.id){cur=t.id;history.replaceState(null,'','#'+t.id)}
  document.title=`ISIONXXX // ${t.label}`;
  try{(f.contentWindow||window).focus()}catch(e){}
}
/* ---------- TODAY: every app on one screen, read straight from what they've saved (read-only) ---------- */
const pad=n=>String(n).padStart(2,'0'),ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const read=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fi=n=>Math.round(n||0).toLocaleString('en-US');
const money=v=>(v<0?'-':v>0?'+':'')+'$'+Math.abs(v).toLocaleString('en-US',{maximumFractionDigits:0});
const span=ms=>{ms=Math.max(0,ms);const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);return d?`${d}d ${h}h`:h?`${h}h ${m}m`:`${m}m`};
const dayAt=ms=>ymd(new Date(ms));
// the last seven days, oldest first, ending today
function week7(){const out=[],d=new Date();d.setHours(12,0,0,0);for(let i=6;i>=0;i--){const x=new Date(d);x.setDate(d.getDate()-i);out.push(x)}return out}
// MIND and TRAINING count their weeks from Sunday
const wkStart=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay());return d.getTime()};
function streakOf(set){let c=0;const d=new Date();if(!set.has(ymd(d)))d.setDate(d.getDate()-1);while(set.has(ymd(d))&&c<3650){c++;d.setDate(d.getDate()-1)}return c}
const arr=x=>Array.isArray(x)?x:[];
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;

function tMind(t){
  const s=read('isx.mind.v1'),L=arr(s?.log);if(!L.length)return null;
  const T=L.filter(e=>dayAt(e.at)===t),goal=s.goal||70;
  const min=Math.round(T.reduce((a,e)=>a+(+e.mins||0),0));
  const R=T.filter(e=>e.pre!=null&&e.post!=null),sh=R.length?R.reduce((a,e)=>a+e.post-e.pre,0)/R.length:null;
  const set=new Set(L.map(e=>dayAt(e.at))),st=streakOf(set);
  return {id:'mind',label:'MIND',done:T.length>0,big:T.length?`${min} min`:'Not yet',
    sub:[T.length?plural(T.length,'session'):'No session today',sh!=null?`mood <b class="${sh>0?'pos':sh<0?'neg':''}">${sh>0?'+':''}${Math.round(sh*10)/10}</b>`:'',st?`${st}-day streak`:''],
    // MIND's goal is set per week (5, 10, 15, 20, 30 min a day x 7); TODAY shows the day's share of it
    meter:{v:min,max:Math.round(goal/7),lb:'Mindful minutes today',val:`${min} / ${Math.round(goal/7)}`},
    dots:week7().map(d=>set.has(ymd(d))?'on':'')};
}
function tTrain(t){
  const s=read('isx.training.v1'),L=arr(s?.log);if(!L.length)return null;
  const work=e=>e.type!=='S',T=L.filter(e=>dayAt(e.at)===t),W=T.filter(work),goal=s.goal||4,ws=wkStart();
  const vol=W.filter(e=>e.type==='W').reduce((a,e)=>a+(+e.sets||0)*(+e.reps||0)*(+e.load||0),0);
  const car=W.filter(e=>e.type==='C').reduce((a,e)=>a+(+e.mins||0),0),str=T.some(e=>!work(e));
  const wd=new Set(L.filter(work).map(e=>dayAt(e.at))),sd=new Set(L.filter(e=>!work(e)).map(e=>dayAt(e.at)));
  const wk=new Set(L.filter(e=>work(e)&&e.at>=ws).map(e=>dayAt(e.at))).size;
  // a day off after the weekly goal is hit is a planned rest day: not a win, but not held against you either
  const rest=!W.length&&wk>=goal;
  return {id:'training',label:'TRAIN',done:W.length?true:rest?null:false,rest,
    big:W.length?plural(W.length,'exercise'):str?'Stretched':'Rest day',
    sub:[vol?`${fi(vol)} ${s.wu||'lb'} lifted`:'',car?`${Math.round(car)} min cardio`:'',str&&W.length?'+ stretch':'',!W.length&&wk>=goal?'weekly goal hit':''],
    meter:{v:wk,max:goal,lb:'Workouts this week',val:`${wk} / ${goal}`},
    dots:week7().map(d=>wd.has(ymd(d))?'on':sd.has(ymd(d))?'half':'')};
}
let fuelStale=false;
function tFuel(t){
  const raw=localStorage.getItem('nj.meals.v1')||'',M=arr(read('nj.meals.v1'));if(!M.length)return null;
  // NUTRITION saves its own daily totals (bowl nutrition is worked out there); if they are older than the meals, it reloads them
  const sum=read('nj.daily.v1'),sig=raw.length+':'+(localStorage.getItem('nj.settings.v1')||'').length;
  fuelStale=!sum||sum.sig!==sig;
  const set=new Set(M.map(m=>dayAt(Date.parse(m.time)))),d=sum?.days?.[t],n=M.filter(m=>dayAt(Date.parse(m.time))===t).length;
  const kT=sum?.kcal||2000,pT=sum?.protein||100;
  return {id:'nutrition',label:'NUTRITION',done:n>0,big:d?`${fi(d.kcal)} kcal`:n?'…':'Nothing yet',
    sub:[n?plural(n,'meal'):'No meals logged today',fuelStale?'<span class="amb">updating…</span>':''],
    meter:{v:d?.kcal||0,max:kT,lb:'Calories',val:`${fi(d?.kcal)} / ${fi(kT)}`},
    meter2:{v:d?.p||0,max:pT,lb:'Protein',val:`${fi(d?.p)} / ${fi(pT)} g`},
    dots:week7().map(x=>set.has(ymd(x))?'on':'')};
}
function tExtract(t){
  const S=arr(read('xl.sessions.v1')),E=arr(read('xl.events.v1')),P=read('xl.progress.v1')||{},goal=(read('xl.settings.v1')||{}).goal||30;
  if(!S.length&&!E.length)return null;
  const set=new Set([...S,...E].map(x=>dayAt(Date.parse(x.time))));
  const min=S.filter(x=>dayAt(Date.parse(x.time))===t).reduce((a,x)=>a+(+x.min||0),0);
  const done=Object.values(P).filter(p=>p&&p.done&&p.date===t),xp=done.reduce((a,p)=>a+(p.xp||0),0),st=streakOf(set);
  return {id:'learn',label:'LEARN',done:set.has(t),big:min>=1?`${Math.round(min)} min`:done.length?plural(done.length,'lesson'):set.has(t)?'Studied':'Not yet',
    sub:[done.length?`${plural(done.length,'lesson')} · <b class="pos">+${xp} XP</b>`:'',st?`${st}-day streak`:''],
    meter:{v:min,max:goal,lb:'Study minutes today',val:`${Math.round(min)} / ${goal}`},
    dots:week7().map(d=>set.has(ymd(d))?'on':'')};
}
function tJournal(){
  const s=read('isx.journal.v1'),T=arr(s?.trades);if(!T.length)return null;
  // same rules as JOURNAL: the trading day rolls over at the evening open, P&L is net of fees
  const roll=s.roll??18,tday=ms=>{const d=new Date(ms);if(roll&&d.getHours()>=roll)d.setDate(d.getDate()+1);return ymd(d)};
  const net=x=>(x.exit-x.entry)*(x.side==='Short'?-1:1)*x.qty*x.mult-(+x.fee||0)-(+x.comm||0);
  const now=tday(Date.now()),D={};T.forEach(x=>{D[tday(x.close)]=(D[tday(x.close)]||0)+net(x)});
  const N=T.filter(x=>tday(x.close)===now),pnl=N.reduce((a,x)=>a+net(x),0),w=N.filter(x=>net(x)>0).length;
  const nd=new Date(now+'T12:00:00');nd.setDate(nd.getDate()-nd.getDay());const ws=ymd(nd);
  const wk=Object.entries(D).filter(([d])=>d>=ws&&d<=now).reduce((a,[,v])=>a+v,0);
  return {id:'journal',label:'JOURNAL',done:null,big:N.length?money(pnl):'No trades',bigCls:N.length?(pnl>0?'pos':pnl<0?'neg':''):'',
    sub:[N.length?`${plural(N.length,'trade')} · ${w} won`:'',`week <b class="${wk>0?'pos':wk<0?'neg':''}">${money(wk)}</b>`],
    dots:week7().map(d=>{const v=D[ymd(d)];return v==null?'':v>0?'pos':v<0?'neg':'on'})};
}
// REWIRE's good habits that tick themselves off from another app's log
const LK={meditate:['isx.mind.v1',e=>e.kind==='M'],breathwork:['isx.mind.v1',e=>e.kind==='B'],mjournal:['isx.mind.v1',e=>e.kind==='J'],mind:['isx.mind.v1'],
  cardio:['isx.training.v1',(e,g)=>e.type==='C'&&(!g.ex||e.ex===g.ex)],reps:['isx.training.v1',(e,g)=>e.type==='B'&&e.ex===g.ex],
  workout:['isx.training.v1',e=>e.type!=='S',1],stretch:['isx.training.v1',e=>e.type==='S',1],meals:['nj.meals.v1'],bowl:['nj.meals.v1',e=>e.kind==='bowl'],
  study:['xl.sessions.v1'],trades:['isx.journal.v1',null,1]};
function lkToday(g,t){
  const L=LK[g.link];if(!L)return 0;const s=read(L[0]),rows=arr(Array.isArray(s)?s:s?.log||s?.trades);
  const n=rows.filter(e=>(!L[1]||L[1](e,g))&&dayAt(e.at??e.close??Date.parse(e.time))===t).length;
  return L[2]?Math.min(1,n):n;
}
function tRewire(t){
  const s=read('isx.rewire.v1'),B=arr(s?.bad),G=arr(s?.good),L=arr(s?.log);if(!B.length&&!G.length)return null;
  const now=Date.now(),slips=L.filter(e=>e.t==='slip'),slipT=slips.some(e=>dayAt(e.at)===t);
  const clean=B.map(b=>{const last=Math.max(b.start||0,...slips.filter(e=>e.b===b.id).map(e=>e.at));return{b,ms:now-last}});
  // same count as REWIRE: what the linked app logged, plus anything ticked off in REWIRE itself
  const good=G.map(g=>(LK[g.link]?lkToday(g,t):0)+L.filter(e=>dayAt(e.at)===t&&e.g===g.name&&(e.t==='done'||(e.t==='resist'&&!e.lk))).length);
  const gd=G.reduce((a,g,i)=>a+Math.min(good[i],g.target||1),0),gt=G.reduce((a,g)=>a+(g.target||1),0);
  const urges=L.filter(e=>e.t==='resist'&&dayAt(e.at)===t).length,start=Math.min(...B.map(b=>b.start||now));
  const sd=new Set(slips.map(e=>dayAt(e.at))),top=clean.sort((a,b)=>a.ms-b.ms)[0];
  // not slipping isn't enough on its own: the win is doing today's good habits (or, with none set up, resisting an urge)
  const won=!slipT&&(gt?gd>=gt:urges>0);
  return {id:'rewire',label:'REWIRE',done:won,slip:slipT,big:top?`${span(top.ms)} clean`:`${gd} / ${gt}`,bigCls:slipT?'neg':'',
    sub:[top&&B.length>1?`shortest of ${B.length} habits`:top?esc(top.b.name):'',slipT?'<b class="neg">slipped today</b>':'',urges?`${plural(urges,'urge')} resisted`:''],
    rows:clean.length>1?clean.map(c=>[esc(c.b.name),span(c.ms)]):null,
    meter:G.length?{v:gd,max:gt,lb:'Good habits today',val:`${gd} / ${gt}`}:top?{v:top.ms/864e5,max:top.b.goal||30,lb:`Goal ${top.b.goal||30} days`,val:`${Math.floor(top.ms/864e5)} / ${top.b.goal||30}`}:null,
    dots:week7().map(d=>{const k=ymd(d);return sd.has(k)?'neg':d.getTime()>=start-864e5?'pos':''})};
}

const meter=m=>{if(!m)return'';const p=m.max?Math.min(100,m.v/m.max*100):0;
  return `<div class="mt"><div class="lb"><span>${m.lb}</span><span>${m.val}</span></div><div class="bar"><i class="${p>=100?'full':''}" style="width:${p.toFixed(1)}%"></i></div></div>`};
const DOW='SMTWTFS';
// one-tap actions on each card: they open the app straight into that action (same as REWIRE's LOG IN buttons)
const QA={mind:[['go','▶ Start session']],training:[['go','▶ Start workout'],['add','+ Log']],nutrition:[['quick','+ Food'],['cook','Cook bowl']],
  learn:[['startnext','▶ Next lesson']],journal:[['add','+ Trade']],rewire:[['urge','Urge']]};
const qa=(id,todo)=>`<div class="qa">${(QA[id]||[]).map(([a,l],i)=>`<button type="button" data-go="${id}" data-act="${a}" class="${i===0&&todo?'pri':''}">${l}</button>`).join('')}</div>`;
function card(c){
  const st=c.slip?'<span class="st bad">SLIPPED</span>':c.done?'<span class="st ok">✓ DONE</span>':c.rest?'<span class="st">REST</span>':c.done===false?'<span class="st">NOT YET</span>':'';
  return `<div class="tc" role="button" tabindex="0" data-open="${c.id}" aria-label="Open ${c.label}">
    <div class="tch"><span class="h">${c.label}</span>${st}</div>
    <div class="big ${c.bigCls||''}">${c.big}</div>
    <div class="sub">${c.sub.filter(Boolean).join(' · ')}</div>
    ${c.rows?`<div class="rws">${c.rows.map(r=>`<div><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>`:''}
    ${meter(c.meter)}${meter(c.meter2)}
    <div class="dots" aria-label="Last 7 days">${week7().map((d,i)=>`<span class="${i===6?'t':''}"><i class="${c.dots[i]}"></i>${DOW[d.getDay()]}</span>`).join('')}</div>
    ${qa(c.id,c.done===false||c.slip)}
  </div>`;
}
const EMPTY={mind:'Meditate, breathe or journal',training:'Log a workout',nutrition:'Log a meal',learn:'Study a lesson',journal:'Import or log trades',rewire:'Name a habit to break'};
/* ---------- morning check-in: hours slept, sleep quality, energy, weight ----------
   One entry a day under isx.checkin.v1 (synced like the apps). It starts from your last answers, so most mornings it's
   a tap or two and Save; once saved it folds into a one-line summary with the week's trend. */
const CIK='isx.checkin.v1',QW=['','Poor','Restless','OK','Good','Great'],EW=['','Drained','Low','Steady','Good','Charged'];
const ciLog=()=>arr(read(CIK)?.log);
const wUnit=()=>read('isx.training.v1')?.wu||(/-US$/.test(navigator.language||'')?'lb':'kg');
const r1=v=>Math.round(v*10)/10,avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
let CI=null;   // the answers being filled in; null when not editing
function ciDraft(t){
  const L=ciLog(),b=L.find(e=>e.day===t)||L.filter(e=>e.day<t).sort((a,c)=>a.day<c.day?1:-1)[0]||{};
  return {day:t,sleep:b.sleep??7.5,q:b.q??3,energy:b.energy??3,w:b.w??null};
}
function ciSave(){
  let s=read(CIK);if(!s||!Array.isArray(s.log))s={log:[]};
  const i=s.log.findIndex(e=>e.day===CI.day);
  // one id per day, so the same day checked in on two devices merges instead of doubling
  const e={id:'ci-'+CI.day,day:CI.day,at:Date.now(),sleep:CI.sleep,q:CI.q,energy:CI.energy,w:CI.w,u:wUnit()};
  if(i>=0)s.log[i]=e;else s.log.push(e);
  localStorage.setItem(CIK,JSON.stringify(s));CI=null;drawToday();
}
function ciAct(k,v){
  if(k==='save')return ciSave();
  if(k==='edit'){CI=ciDraft(ymd(new Date()));return drawToday()}
  if(k==='cancel'){CI=null;return drawToday()}
  if(k==='sleep')CI.sleep=Math.min(14,Math.max(0,CI.sleep+ +v));else CI[k]=+v;
  drawToday();
}
function ciHTML(){
  const t=ymd(new Date()),L=ciLog(),done=L.find(e=>e.day===t),h=new Date().getHours();
  if(CI&&CI.day!==t)CI=null;
  if(done&&!CI){
    const wk=L.filter(e=>e.day<t).sort((a,b)=>a.day<b.day?1:-1).slice(0,7),sl=avg(wk.map(e=>e.sleep)),wa=avg(wk.filter(e=>e.w).map(e=>e.w)),dw=done.w&&wa?r1(done.w-wa):null;
    return `<section class="ci done"><div class="tch"><span class="h">Morning check-in</span><button type="button" class="st ok" data-ci="edit">✓ Edit</button></div>
      <div class="ci-sum"><div><b>${done.sleep} h</b><span>sleep${sl!=null?` · wk ${r1(sl)}`:''}</span></div><div><b>${QW[done.q]}</b><span>quality</span></div><div><b>${EW[done.energy]}</b><span>energy</span></div>
      ${done.w?`<div><b>${done.w}</b><span>${done.u||wUnit()}${dw!=null?` · ${dw>0?'+':''}${dw} vs wk`:''}</span></div>`:''}</div></section>`;
  }
  const d=CI||(CI=ciDraft(t));
  const seg=(k,W)=>`<div class="ci-seg">${[1,2,3,4,5].map(v=>`<button type="button" data-ci="${k}" data-v="${v}" class="${d[k]===v?'on':''}" aria-label="${W[v]}">${v}</button>`).join('')}</div>`;
  return `<section class="ci"><div class="tch"><span class="h">${h<12?'Good morning':h<18?'Good afternoon':'Good evening'} · check-in</span><span class="st">10 SEC</span></div>
    <div class="ci-row"><span class="ci-l">Sleep</span><div class="ci-step"><button type="button" data-ci="sleep" data-v="-0.5" aria-label="Less sleep">−</button><b>${d.sleep} h</b><button type="button" data-ci="sleep" data-v="0.5" aria-label="More sleep">+</button></div></div>
    <div class="ci-row"><span class="ci-l">Sleep quality <em>${QW[d.q]}</em></span>${seg('q',QW)}</div>
    <div class="ci-row"><span class="ci-l">Energy <em>${EW[d.energy]}</em></span>${seg('energy',EW)}</div>
    <div class="ci-row"><span class="ci-l">Weight <em>optional</em></span><div class="ci-w"><input id="ciw" type="number" inputmode="decimal" step="0.1" min="0" value="${d.w??''}" placeholder="—" aria-label="Weight"><span>${wUnit()}</span></div></div>
    <div class="qa">${done?'<button type="button" data-ci="cancel">Cancel</button>':''}<button type="button" class="pri" data-ci="save">${done?'Update':'Save check-in'}</button></div></section>`;
}
function drawToday(){
  const el=$('#today');if(!el)return;
  if(document.activeElement?.id==='ciw')return;   // don't redraw under you while you type your weight
  const t=ymd(new Date()),C=[tMind(t),tTrain(t),tFuel(t),tExtract(t),tJournal(),tRewire(t)];
  const ids=['mind','training','nutrition','learn','journal','rewire'],used=C.filter(Boolean),wins=used.filter(c=>c.done!=null),won=wins.filter(c=>c.done).length;
  const r=26,L=2*Math.PI*r,p=wins.length?won/wins.length:0,next=wins.find(c=>!c.done&&!c.rest);
  const d=new Date(),date=d.toLocaleDateString('en-US',{weekday:'short',day:'numeric',month:'short'}).toUpperCase();
  const top=wins.length?`<section class="wins">
      <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="${r}" class="r0"/><circle cx="32" cy="32" r="${r}" class="r1${p>=1?' full':''}" stroke-dasharray="${(L*p).toFixed(1)} ${L.toFixed(1)}"/><text x="32" y="37">${won}/${wins.length}</text></svg>
      <div><div class="h">Daily wins</div><div class="sub">${p>=1?'Everything done today. Nice.':won?`${wins.length-won} to go today`:'Nothing logged yet today'}</div>
      <div class="chips">${wins.map(c=>`<button type="button" data-open="${c.id}" class="${c.done?'ok':''}">${c.done?'✓ ':''}${c.label}</button>`).join('')}</div>
      ${next?`<button type="button" class="nx" data-go="${next.id}" data-act="${QA[next.id][0][0]}">Next up · ${next.label} <b>${QA[next.id][0][1]}</b></button>`:''}</div></section>`:
    `<section class="wins solo"><div><div class="h">Welcome</div><div class="sub">Log something in any app and today's progress shows up here: minutes, workouts, calories, study streaks, P&amp;L and clean time, all on one screen.</div></div></section>`;
  const cards=C.map((c,i)=>c?card(c):`<button type="button" class="tc none" data-open="${ids[i]}"><div class="tch"><span class="h">${TABS.find(x=>x.id===ids[i]).label}</span><span class="st">START</span></div><div class="sub">${EMPTY[ids[i]]} →</div></button>`);
  // what's still to do today first, then neutral (journal, rest day), then done; apps you haven't started at the end
  const rank=c=>!c?3:c.done===false||c.slip?0:c.done?2:1;
  const order=C.map((c,i)=>[rank(c),i]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]).map(x=>cards[x[1]]);
  el.innerHTML=`<div class="in"><header class="th top"><div class="brand">ISIONXXX <b>//</b> TODAY<span class="cur"></span></div><div class="acts"><span class="dt"><i>${date.split(',')[0]}, </i>${date.split(', ').slice(1).join(', ')}</span></div></header>${ciHTML()}${top}<div class="tg">${order.join('')}</div></div>`;
  if(fuelStale)preload('nutrition');
}

// TODAY refreshes whenever it comes into view, when any app saves, and each minute (clean-time counters)
const todayOn=()=>$('#today').classList.contains('on');
let tdT=0;addEventListener('storage',()=>{if(todayOn()){clearTimeout(tdT);tdT=setTimeout(drawToday,250)}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&todayOn())drawToday()});
setInterval(()=>{if(todayOn()&&!document.hidden)drawToday()},60e3);
addEventListener('isx-sync',()=>{if(todayOn())drawToday()});
$('#today').addEventListener('input',e=>{if(e.target.id==='ciw'&&CI)CI.w=e.target.value===''?null:Math.max(0,+e.target.value)});
$('#today').addEventListener('click',e=>{const c=e.target.closest('[data-ci]');if(c)return ciAct(c.dataset.ci,c.dataset.v);const a=e.target.closest('[data-go]');if(a)return openAct(a.dataset.go,a.dataset.act);const b=e.target.closest('[data-open]');if(b)show(b.dataset.open)});
$('#today').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.tc')){e.preventDefault();show(e.target.dataset.open)}});
{ // the bar hides on scroll here too
  const el=$('#today');let y0=0;
  el.addEventListener('scroll',()=>{const y=el.scrollTop;if(Math.abs(y-y0)<8)return;const end=y+el.clientHeight>=el.scrollHeight-4;if(todayOn())setBar(y>y0&&y>40&&!end);y0=y},{passive:true});
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b)show(b.dataset.t)});
// an app asks to open another one (e.g. REWIRE's OPEN buttons): switch tabs instead of opening a new window
addEventListener('message',e=>{
  if(e.origin!==location.origin||!e.data||e.data.isx!=='open')return;
  const t=TABS.find(x=>x.id===(OLD[e.data.app]||e.data.app));if(!t)return;
  openAct(t.id,e.data.act);
});
// switch to an app and straight into an action there (REWIRE's LOG IN TRAINING opens TRAINING's START), once it has loaded
function openAct(id,act){
  show(id);const f=document.getElementById('f-'+id);
  if(act&&f){const go=()=>f.contentWindow.postMessage({isx:'do',act},location.origin);f.dataset.ready?go():f.addEventListener('load',()=>setTimeout(go,60),{once:true})}
}
addEventListener('hashchange',()=>show(location.hash.slice(1)));
// the app opens on TODAY; a link to a tab (#fuel) opens that tab
roomToday();show(location.hash.slice(1)||'today');
// with sync on, the other apps load quietly in the background so TODAY shows what you logged on your other devices
try{if(localStorage.getItem('isx.sync.cfg'))TABS.filter(t=>!t.pane).forEach((t,i)=>setTimeout(()=>preload(t.id),1200+i*700))}catch(e){}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
