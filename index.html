/* ---------- sleep: check out at night, check in on waking ----------

   outs: one check-out a night ({id 'co-<night>', night, at, day}): when you went to bed, and how the day went (1–5,
   optional). A night is named by its evening: before 4 AM it is still last night.
   TODAY shows one Sleep card. It changes with the day: in the morning it asks how you slept; once you've checked in
   it shows last night (a ring against 8 h, bed to wake) and the week; from 7 PM it adds Check out; checked out, it says
   since when. The check-in and the check-out are two full screens (a sheet on phones):

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
